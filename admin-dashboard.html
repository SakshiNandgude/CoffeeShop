<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    padding: 20px;
    margin: 0;
}

h1 {
    text-align: center;
}

/* FILTER BUTTONS */
.filters {
    text-align: center;
    margin-bottom: 20px;
}

button {
    padding: 8px 15px;
    margin: 5px;
    border: none;
    background: #6f4e37;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
}

button.active {
    background: black;
    transform: scale(1.05);
}

/* CARDS */
.dashboard {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin: 30px 0;
    flex-wrap: wrap;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    width: 200px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* TABLE SECTION */
.table-section {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin: 20px auto;
    max-width: 900px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.table-section h2 {
    margin-bottom: 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #6f4e37;
    color: white;
}

th, td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

tr:hover {
    background: #f9f9f9;
}

/* CHART */
canvas {
    margin-top: 30px;
}

/* MOBILE */
@media (max-width: 768px) {
    .dashboard {
        flex-direction: column;
        align-items: center;
    }

    table {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<h1>📊 Admin Dashboard</h1>

<!-- FILTER BUTTONS -->
<div class="filters">
    <button class="active" onclick="setActive(this); loadDashboard()">All</button>
    <button onclick="setActive(this); filterData('daily')">Today</button>
    <button onclick="setActive(this); filterData('monthly')">This Month</button>
</div>

<!-- CARDS -->
<div class="dashboard">
    <div class="card">
        <h3>Total Orders</h3>
        <p id="orders">0</p>
    </div>

    <div class="card">
        <h3>Total Revenue</h3>
        <p>₹<span id="revenue">0</span></p>
    </div>

    <div class="card">
        <h3>Top Item</h3>
        <p id="topItem">-</p>
    </div>
</div>

<!-- 📋 ORDERS TABLE -->
<section class="table-section">
    <h2>📋 Orders</h2>

    <table>
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Item</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Date</th>
            </tr>
        </thead>

        <tbody id="tableBody">
        </tbody>
    </table>
</section>

<!-- CHART -->
<canvas id="chart"></canvas>

<script src="js/dashboard.js"></script>

</body>
</html>
